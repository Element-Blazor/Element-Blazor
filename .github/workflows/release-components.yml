name: Release Components To NuGet

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version, for example 2.14.0-alpha.1"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PACKAGE_OUTPUT: artifacts/packages

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag must look like v1.2.3 or v1.2.3-alpha.1. Got: ${GITHUB_REF_NAME}"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: |
          dotnet restore src/Components/Element.csproj
          dotnet restore src/Markdown/Element.Markdown.csproj
          dotnet restore src/X/Element.X.csproj
          dotnet restore test/Element.ComponentTests/Element.ComponentTests.csproj

      - name: Test components
        run: dotnet test test/Element.ComponentTests/Element.ComponentTests.csproj -c Release --no-restore

      - name: Build packages
        run: |
          dotnet build src/Components/Element.csproj -c Release --no-restore \
            /p:PackageVersion=${{ steps.version.outputs.version }} \
            /p:Version=${{ steps.version.outputs.version }} \
            /p:GeneratePackageOnBuild=false
          dotnet build src/Markdown/Element.Markdown.csproj -c Release --no-restore \
            /p:PackageVersion=${{ steps.version.outputs.version }} \
            /p:Version=${{ steps.version.outputs.version }} \
            /p:GeneratePackageOnBuild=false
          dotnet build src/X/Element.X.csproj -c Release --no-restore \
            /p:PackageVersion=${{ steps.version.outputs.version }} \
            /p:Version=${{ steps.version.outputs.version }} \
            /p:GeneratePackageOnBuild=false

      - name: Pack Element
        run: >
          dotnet pack src/Components/Element.csproj
          -c Release
          --no-build
          --no-restore
          -o ${{ env.PACKAGE_OUTPUT }}
          /p:PackageVersion=${{ steps.version.outputs.version }}
          /p:Version=${{ steps.version.outputs.version }}
          /p:GeneratePackageOnBuild=false

      - name: Pack Element.Markdown
        run: >
          dotnet pack src/Markdown/Element.Markdown.csproj
          -c Release
          --no-build
          --no-restore
          -o ${{ env.PACKAGE_OUTPUT }}
          /p:PackageVersion=${{ steps.version.outputs.version }}
          /p:Version=${{ steps.version.outputs.version }}
          /p:GeneratePackageOnBuild=false

      - name: Pack Element.X
        run: >
          dotnet pack src/X/Element.X.csproj
          -c Release
          --no-build
          --no-restore
          -o ${{ env.PACKAGE_OUTPUT }}
          /p:PackageVersion=${{ steps.version.outputs.version }}
          /p:Version=${{ steps.version.outputs.version }}
          /p:GeneratePackageOnBuild=false

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v7
        with:
          name: element-blazor-${{ steps.version.outputs.version }}-packages
          path: |
            ${{ env.PACKAGE_OUTPUT }}/*.nupkg
            ${{ env.PACKAGE_OUTPUT }}/*.snupkg

      - name: Verify package outputs
        shell: bash
        run: |
          expected_packages=(
            "Element.${{ steps.version.outputs.version }}.nupkg"
            "Element.Markdown.${{ steps.version.outputs.version }}.nupkg"
            "Element.X.${{ steps.version.outputs.version }}.nupkg"
            "Element.${{ steps.version.outputs.version }}.snupkg"
            "Element.Markdown.${{ steps.version.outputs.version }}.snupkg"
            "Element.X.${{ steps.version.outputs.version }}.snupkg"
          )

          for package in "${expected_packages[@]}"; do
            if [[ ! -f "${{ env.PACKAGE_OUTPUT }}/$package" ]]; then
              echo "::error::Missing NuGet artifact: $package"
              exit 1
            fi
          done

      - name: Publish to NuGet
        env:
          NUGET_KEY: ${{ secrets.NUGET_KEY }}
        run: |
          for package in "${{ env.PACKAGE_OUTPUT }}"/*.nupkg; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
          for symbols in "${{ env.PACKAGE_OUTPUT }}"/*.snupkg; do
            dotnet nuget push "$symbols" \
              --api-key "$NUGET_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          dotnet nuget remove source github >/dev/null 2>&1 || true
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --name github \
            --username "${{ github.actor }}" \
            --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text

          for package in "${{ env.PACKAGE_OUTPUT }}"/*.nupkg; do
            dotnet nuget push "$package" \
              --api-key "$GITHUB_TOKEN" \
              --source github \
              --skip-duplicate
          done

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          RELEASE_TAG="${{ steps.version.outputs.release_tag }}"
          RELEASE_TITLE="Element-Blazor ${{ steps.version.outputs.version }}"
          RELEASE_NOTES="Element-Blazor ${{ steps.version.outputs.version }} packages published to NuGet."
          ASSETS=(
            "${{ env.PACKAGE_OUTPUT }}"/*.nupkg
            "${{ env.PACKAGE_OUTPUT }}"/*.snupkg
          )
          PRERELEASE_FLAGS=()
          if [[ "${{ steps.version.outputs.version }}" == *-* ]]; then
            PRERELEASE_FLAGS+=(--prerelease)
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES" \
              "${PRERELEASE_FLAGS[@]}"
            gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${ASSETS[@]}" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES" \
              "${PRERELEASE_FLAGS[@]}"
          fi
